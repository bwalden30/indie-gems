<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie Gems | Discover Your Next Masterpiece</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0c29;
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --accent: #facc15; 
            --accent-hover: #fde047;
            --text: #ffffff;
            --muted: #cbd5e1;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 0.1);
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            text-align: center;
            padding: 5rem 2rem 3rem;
            max-width: 800px;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #facc15, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(250, 204, 21, 0.3));
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--muted);
            margin-top: 1rem;
            line-height: 1.6;
        }

        .badge {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            display: inline-block;
            margin-bottom: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
            width: 90%;
            max-width: 1200px;
            padding-bottom: 5rem;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid var(--glass-border);
        }

        .card-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #fff;
        }

        .card-desc {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            flex-grow: 1;
        }

        .btn {
            display: block;
            text-align: center;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(250, 204, 21, 0.5);
        }

        footer {
            margin-top: auto;
            padding: 3rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2.5rem; }
            .grid { width: 95%; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="badge">✨ AI-Powered Discovery</div>
        <h1>💎 Indie Gems</h1>
        <p>We use artificial intelligence to sift through thousands of Steam games to find the high-rated, low-visibility masterpieces you've been missing.</p>
    </section>

    <div class="grid" id="game-grid"></div>

    <footer>
        &copy; 2026 Indie Gems • Curated by AI for Humans
    </footer>

    <script>
        async function loadGames() {
            try {
                const response = await fetch(`games.json?t=${new Date().getTime()}`);
                const games = await response.json();
                const grid = document.getElementById('game-grid');
                
                if (!games || games.length === 0) {
                    grid.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: var(--muted);">Searching the vault for new gems... check back soon!</p>`;
                    return;
                }

                grid.innerHTML = games.map(game => `
                    <div class="card">
                        <img class="card-img" src="${game.image}" alt="${game.title}">
                        <div class="card-content">
                            <div class="card-title">${game.title}</div>
                            <div class="card-desc">${game.description}</div>
                            <a class="btn" href="${game.url}" target="_blank">View on Steam</a>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Error loading gems:", e);
            }
        }
        loadGames();
    </script>
</body>
</html>
