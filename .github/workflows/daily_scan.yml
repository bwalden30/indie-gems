name: Daily Gem Scan
on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual run

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests groq
      - name: Run Scanner
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python main.py
      - name: Commit and Push
        run: |
          git config --global user.name "GemBot"
          git config --global user.email "bot@gem.com"
          git add games.json
          git commit -m "Daily update of hidden gems" || echo "No changes to commit"
          git push
